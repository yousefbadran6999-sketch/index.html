<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badran CNC Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* ألوان مستوحاة من اللوجو */
            --primary-blue: #0056b3; /* الأزرق الغامق */
            --primary-red: #d32f2f; /* الأحمر */
            --whatsapp-green: #25d366;
            --bg-white: #ffffff;
            --text-dark: #1a1a1a;
            --card-gray: #f8f9fa;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-white);
            color: var(--text-dark);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            /* علامة مائية للوجو خفيفة جداً في الخلفية */
            background-image: linear-gradient(rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.9)), url('logo.png');
            background-repeat: no-repeat;
            background-position: center 30%;
            background-size: 50% auto;
            background-attachment: fixed;
        }

        header {
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            border-bottom: 3px solid var(--primary-blue);
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        header img {
            height: 90px;
            width: auto;
            margin-bottom: 5px;
        }

        header h1 {
            margin: 0;
            font-size: 26px;
            color: var(--primary-red);
            text-transform: uppercase;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            padding: 30px;
            padding-bottom: 120px; /* مساحة تحت عشان زر الإضافة */
        }

        .product-card {
            background: rgba(248, 249, 250, 0.95);
            border-radius: 15px;
            border: 1px solid #eee;
            padding: 20px;
            text-align: center;
            transition: 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-red);
            box-shadow: 0 8px 25px rgba(211, 47, 47, 0.15);
        }

        .product-icon {
            font-size: 60px;
            color: var(--primary-blue);
            margin-bottom: 15px;
        }

        .product-name {
            font-size: 18px;
            margin: 0 0 10px 0;
            font-weight: bold;
        }

        .price {
            font-size: 24px;
            color: var(--primary-red);
            font-weight: bold;
            display: block;
            margin: 10px 0 20px 0;
        }
