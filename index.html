<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Badran CNC Store</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #0a3d7c;
    --blue-mid: #0056b3;
    --blue-light: #1a73e8;
    --red: #c0392b;
    --red-bright: #e74c3c;
    --gold: #f39c12;
    --white: #ffffff;
    --off-white: #f7f9fc;
    --text: #1a1e2e;
    --text-muted: #64748b;
    --shadow: 0 8px 32px rgba(10,61,124,0.12);
    --radius: 16px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Cairo', sans-serif;
    background: var(--off-white);
    color: var(--text);
    min-height: 100vh;
  }

  header {
    background: linear-gradient(135deg, var(--blue) 0%, var(--blue-mid) 60%, var(--blue-light) 100%);
    padding: 14px 24px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(0,0,0,0.25);
  }

  .header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    max-width: 1400px;
    margin: 0 auto;
  }

  .logo-area { display: flex; align-items: center; gap: 14px; cursor: pointer; }

  .logo-area img {
    height: 58px; width: 58px;
    object-fit: contain; border-radius: 12px;
    background: white; padding: 4px;
  }

  .logo-text h1 { color: white; font-size: 1.4rem; font-weight: 900; }
  .logo-text span { color: var(--gold); font-size: 0.75rem; font-weight: 600; }

  #adminLoginBtn {
    background: rgba(255,255,255,0.15);
    color: white; border: 1.5px solid rgba(255,255,255,0.4);
    border-radius: 22px; padding: 8px 18px; cursor: pointer;
    font-weight: 700; transition: 0.2s;
  }
  #adminLoginBtn.logged-in { background: #27ae60; border-color: #27ae60; }

  .hero-strip {
    background: linear-gradient(90deg, var(--red) 0%, var(--red-bright) 100%);
    color: white; text-align: center; padding: 8px; font-size: 0.85rem; font-weight: 600;
  }

  .stats-bar { background: white; border-bottom: 1px solid #e2e8f0; padding: 12px 24px; }
  .stats-inner { max-width: 1400px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }

  .grid-container { max-width: 1400px; margin: 0 auto; padding: 24px; }
  .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }

  .product-card {
    background: white; border-radius: var(--radius); overflow: hidden;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06); border: 1.5px solid #e8eef5;
    cursor: pointer; transition: 0.3s; position: relative;
  }
  .product-card:hover { transform: translateY(-5px); box-shadow: var(--shadow); border-color: var(--blue-light); }

  .card-img-wrap { width: 100%; height: 190px; background: #f0f4fa; display: flex; align-items: center; justify-content: center; }
  .card-img-wrap img { width: 100%; height: 100%; object-fit: contain; padding: 10px; }

  .card-body { padding: 15px; }
  .card-name { font-size: 1rem; font-weight: 700; margin-bottom: 5px; }
  .price { background: var(--red); color: white; padding: 4px 12px; border-radius: 20px; font-weight: 700; }

  /* Admin Add Button */
  #admin-add-btn {
    position: fixed; bottom: 30px; right: 30px;
    width: 60px; height: 60px; background: var(--blue);
    color: white; border: none; border-radius: 50%;
    font-size: 30px; cursor: pointer; display: none;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3); z-index: 1000;
  }

  /* Modal */
  .modal {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    z-index: 2000; justify-content: center; align-items: center; backdrop-filter: blur(5px);
  }
  .modal.open { display: flex; }
  .modal-content { background: white; width: 90%; max-width: 450px; border-radius: 20px; padding: 20px; position: relative; }

  .wa-btn-big {
    background: #25d366; color: white; padding: 12px; border-radius: 12px;
    display: block; text-align: center; text-decoration: none; font-weight: 700; margin-top: 15px;
  }

  /* Admin Controls */
  .admin-controls { position: absolute; top: 10px; right: 10px; display: none; gap: 5px; }
  body.admin-mode .admin-controls { display: flex; }
  .del-btn { background: var(--red); color: white; border: none; padding: 5px; border-radius: 5px; cursor: pointer; }

  #toast {
    position: fixed; bottom: 20px; left: 20px; background: #333; color: white;
    padding: 10px 20px; border-radius: 10px; opacity: 0; transition: 0.3s;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo-area" id="logoArea">
      <img src="logo.png" alt="Logo">
      <div class="logo-text">
        <h1>Badran CNC</h1>
        <span>Premium CNC Spare Parts</span>
      </div>
    </div>
    <button id="adminLoginBtn">🔐 Admin</button>
  </div>
</header>

<div class="hero-strip">
  Fast Shipping Across Egypt | Contact via WhatsApp for Best Prices 🚀
</div>

<div class="stats-bar">
  <div class="stats-inner">
    <div>Items in Cart: <strong id="statsCount">0</strong></div>
    <div id="gridCount">0 Products Available</div>
  </div>
</div>

<div class="grid-container">
  <div class="products-grid" id="mainGrid"></div>
</div>

<button id="admin-add-btn" onclick="openForm()">+</button>

<div id="descModal" class="modal">
  <div class="modal-content">
    <button onclick="closeModal()" style="position:absolute; top:10px; left:10px; border:none; background:none; font-size:20px; cursor:pointer;">&times;</button>
    <img id="modalImg" src="" style="width:100%; height:200px; object-fit:contain; margin-bottom:15px;">
    <h2 id="modalTitle"></h2>
    <p id="modalDesc" style="margin: 15px 0; color: #555;"></p>
    <div id="modalPrice" class="price" style="display:inline-block;"></div>
    <button id="checkoutBtn" class="wa-btn-big">Checkout Now 🛒</button>
  </div>
</div>

<div id="toast">Message here</div>

<script>
    const whatsappNum = "201118886050"; 
    const adminPassword = "go772010";
    let cart = [];

    let products = JSON.parse(localStorage.getItem('badran_products')) || [
        { id: 1, name: "Spindle Motor 2.2KW", price: "4500", cat: "Motors", desc: "Air-cooled, high performance for heavy duty work.", img: "logo.png" },
        { id: 2, name: "Mach3 USB Controller", price: "1250", cat: "Electronics", desc: "4-Axis control board with USB interface.", img: "logo.png" }
    ];

    // Admin Login
    document.getElementById('logoArea').onclick = function() {
        const pass = prompt("Enter Admin Password:");
        if (pass === adminPassword) {
            document.body.classList.add('admin-mode');
            document.getElementById('admin-add-btn').style.display = 'block';
            document.getElementById('adminLoginBtn').classList.add('logged-in');
            document.getElementById('adminLoginBtn').innerText = "🔓 Admin Active";
            showToast("Welcome Back, Youssef! ✅");
        } else if (pass !== null) {
            showToast("Wrong Password! ❌");
        }
    };

    function renderGrid() {
        const grid = document.getElementById('mainGrid');
        grid.innerHTML = '';
        products.forEach(p => {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                <div class="admin-controls">
                    <button class="del-btn" onclick="event.stopPropagation(); deleteProduct(${p.id})">Delete</button>
                </div>
                <div class="card-img-wrap" onclick="showProduct(${p.id})">
                    <img src="${p.img || 'logo.png'}">
                </div>
                <div class="card-body" onclick="showProduct(${p.id})">
                    <div class="card-name">${p.name}</div>
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
                        <span class="price">${p.price} EGP</span>
                        <button onclick="event.stopPropagation(); addToCart()" style="border:none; background:none; font-size:20px;">🛒</button>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
        document.getElementById('gridCount').innerText = `${products.length} Products Available`;
    }

    function showProduct(id) {
        const p = products.find(p => p.id === id);
        document.getElementById('modalTitle').innerText = p.name;
        document.getElementById('modalDesc').innerText = p.desc;
        document.getElementById('modalPrice').innerText = p.price + " EGP";
        document.getElementById('modalImg').src = p.img || 'logo.png';
        document.getElementById('checkoutBtn').onclick = () => checkout(p.name, p.price);
        document.getElementById('descModal').classList.add('open');
    }

    function checkout(name, price) {
        const cName = prompt("Full Name:");
        const cPhone = prompt("Phone Number:");
        const cAddr = prompt("Shipping Address:");
        if (!cName || !cPhone || !cAddr) return;

        const pay = prompt("Payment Method:\n1 - Vodafone Cash (01118886050)\n2 - InstaPay\n3 - Cash on Delivery");
        let payTxt = pay === "1" ? "Vodafone Cash" : pay === "2" ? "InstaPay" : "Cash on Delivery";

        const msg = `🚀 *New Order - Badran CNC*\n\n` +
                    `👤 *Customer:* ${cName}\n` +
                    `📞 *Phone:* ${cPhone}\n` +
                    `📍 *Address:* ${cAddr}\n\n` +
                    `🛠️ *Item:* ${name}\n` +
                    `💰 *Total:* ${price} EGP\n` +
                    `💳 *Payment:* ${payTxt}`;

        window.open(`https://wa.me/${whatsappNum}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function addToCart() {
        cart.push({});
        document.getElementById('statsCount').innerText = cart.length;
        showToast("Added to Cart! 🛒");
    }

    function openForm() {
        const name = prompt("Product Name:");
        const price = prompt("Price (EGP):");
        const desc = prompt("Description:");
        const img = prompt("Image filename (e.g., motor.jpg):");
        if (name && price) {
            products.push({ id: Date.now(), name, price, desc, img });
            localStorage.setItem('badran_products', JSON.stringify(products));
            renderGrid();
        }
    }

    function deleteProduct(id) {
        if (confirm("Delete this item?")) {
            products = products.filter(p => p.id !== id);
            localStorage.setItem('badran_products', JSON.stringify(products));
            renderGrid();
        }
    }

    function closeModal() { document.getElementById('descModal').classList.remove('open'); }
    function showToast(msg) {
        const t = document.getElementById('toast'); t.innerText = msg;
        t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000);
    }

    renderGrid();
</script>
</body>
</html>
