<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badran CNC Store | متجر بدران لقطع الغيار</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #f39c12; 
            --dark: #0a0a0a;
            --card-bg: #1a1a1a;
            --text: #ffffff;
            --whatsapp: #25d366;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--dark);
            color: var(--text);
            margin: 0;
            padding: 0;
            background-image: linear-gradient(rgba(10, 10, 10, 0.85), rgba(10, 10, 10, 0.85)), url('logo.png');
            background-repeat: no-repeat;
            background-position: center;
            background-size: 50% auto;
            background-attachment: fixed;
        }

        /* شاشة الترحيب */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--dark);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        #splash-screen h2 {
            color: var(--primary);
            font-size: 35px;
            margin-top: 20px;
            text-transform: uppercase;
        }

        .loader {
            border: 5px solid #333;
            border-top: 5px solid var(--primary);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* الهيدر */
        header {
            background: #111;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            border-bottom: 3px solid var(--primary);
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }

        header img { height: 70px; margin-bottom: 10px; border-radius: 10px; }
        header h1 { margin: 0; font-size: 26px; color: var(--primary); }

        /* الشبكة */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding: 30px;
            min-height: 500px;
        }

        .product-card {
            background: rgba(26, 26, 26, 0.9);
            border-radius: 15px;
            border: 1px solid #333;
            padding: 15px;
            text-align: center;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover { border-color: var(--primary); transform: translateY(-5px); }

        .product-img-placeholder {
            width: 100%;
            height: 180px;
            background: #000;
            border-radius: 10px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
        }

        .price { font-size: 22px; color: var(--primary); font-weight: bold; margin: 10px 0; display: block; }

        .buy-btn {
            background: var(--whatsapp);
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* زر الإضافة */
        .add-btn {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 65px;
            height: 65px;
            background: var(--primary);
            border-radius: 50%;
            border: none;
            color: white;
            font-size: 35px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            z-index: 100;
        }

        footer { text-align: center; padding: 40px; color: #555; font-size: 14px; }
    </style>
</head>
<body>

<div id="splash-screen">
    <div class="loader"></div>
    <h2>Badran CNC</h2>
    <p>جاري تحميل المتجر...</p>
</div>

<header>
    <img src="logo.png" alt="Badran CNC Logo">
    <h1>Badran CNC Store</h1>
    <p>قطع غيار ماكينات CNC الأصلية</p>
</header>

<div class="products-grid" id="container">
    </div>

<button class="add-btn" onclick="addNewProduct()" title="إضافة منتج جديد">➕</button>

<footer>
    &copy; 2026 Badran CNC - جميع الحقوق محفوظة
</footer>

<script>
    const whatsappNum = "201118886050";
    const container = document.getElementById('container');

    // وظيفة إخفاء شاشة الترحيب
    window.onload = () => {
        setTimeout(() => {
            const splash = document.getElementById('splash-screen');
            splash.style.opacity = '0';
            setTimeout(() => splash.style.display = 'none', 500);
        }, 2000); // تظهر لمدة ثانيتين
    };

    function createProduct(name, price) {
        const msg = encodeURIComponent(`أهلاً Badran CNC، أريد الاستفسار عن: ${name}`);
        return `
            <div class="product-card">
                <div class="product-img-placeholder">⚙️</div>
                <h3>${name}</h3>
                <span class="price">${price} ج.م</span>
                <a href="https://wa.me/${whatsappNum}?text=${msg}" target="_blank" class="buy-btn">
                    طلب عبر واتساب ✅
                </a>
            </div>
        `;
    }

    // منتجات تظهر تلقائياً عند الافتتاح
    function initialLoad() {
        container.innerHTML += createProduct("موتور سبندل 2.2KW", "4500");
        container.innerHTML += createProduct("كنترولر Mach3 USB", "1200");
        container.innerHTML += createProduct("طقم ريش تقطيع 6mm", "150");
    }

    function addNewProduct() {
        const name = prompt("ادخل اسم قطعة الغيار:");
        const price = prompt("ادخل السعر بالجنية المصري:");
        if(name && price) {
            container.innerHTML += createProduct(name, price);
        }
    }

    initialLoad();
</script>

</body>
</html>
